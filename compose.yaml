services:
  manxue-ai:
    build: ./app
    image: manxue-ai:local
    container_name: manxue-ai
    # Reap Chromium descendants so repeated visual reviews cannot exhaust pids_limit.
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8765"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - manxue-ai-data:/data
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  manxue-ai-data:
