name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node --check app/web/app.js && node --check app/web/admin.js
      - run: docker compose config --quiet
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t manxue-ai:test app
      - name: Isolated browser and end-to-end tests
        run: >-
          docker run --rm --init --network none --pids-limit 256 --memory 1g --cpus 1
          --tmpfs /data --mount type=bind,src="$PWD/tests",dst=/tests,readonly -w /
          -e PYTHONDONTWRITEBYTECODE=1 -e RENDER_TESTS=1
          manxue-ai:test python -m unittest discover -s /tests -v
      - name: Process lifecycle regression
        run: >-
          docker run --rm --init --network none --pids-limit 256 --memory 1g --cpus 1
          --tmpfs /data --mount type=bind,src="$PWD/tests",dst=/tests,readonly -w /
          -e PYTHONDONTWRITEBYTECODE=1 manxue-ai:test python /tests/soak.py --iterations 20
